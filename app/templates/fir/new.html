{% extends 'base.html' %}
{% block content %}
<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-12"><div class="card"><div class="card-body"><h5 class="mb-1">First Information Report</h5><p class="text-muted mb-0">Fields marked with <span class="text-danger">*</span> are required. This creates a new crime record and FIR entry.</p></div></div></div>
  <div class="col-12"><div class="card"><div class="card-body"><h5>1. Informant / complainant</h5><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name *</label><input required name="informant_name" class="form-control" value="{{ request.form.get('informant_name','') }}"></div><div class="col-md-3"><label class="form-label">Age</label><input name="informant_age" min="0" max="130" type="number" class="form-control"></div><div class="col-md-3"><label class="form-label">Gender</label><select name="informant_gender" class="form-select"><option value="">Not stated</option><option>Female</option><option>Male</option><option>Other</option></select></div><div class="col-md-6"><label class="form-label">Phone</label><input name="informant_phone" maxlength="30" class="form-control"></div><div class="col-md-6"><label class="form-label">Address *</label><input required name="informant_address" class="form-control"></div></div></div></div></div>
  <div class="col-12"><div class="card"><div class="card-body"><h5>2. Occurrence and jurisdiction</h5><div class="row g-3"><div class="col-md-3"><label class="form-label">Date of occurrence *</label><input required name="occurred_date" type="date" value="{{ today }}" class="form-control"></div><div class="col-md-3"><label class="form-label">Time of occurrence</label><input name="occurred_time" type="time" class="form-control"></div><div class="col-md-3"><label class="form-label">Report date *</label><input required name="report_date" type="date" value="{{ today }}" class="form-control"></div><div class="col-md-3"><label class="form-label">Report time</label><input name="report_time" type="time" class="form-control"></div><div class="col-md-4"><label class="form-label">District *</label><input required name="district" class="form-control" placeholder="e.g. Mysuru"></div><div class="col-md-4"><label class="form-label">Police station *</label><input required name="police_station" class="form-control"></div><div class="col-md-4"><label class="form-label">Place of occurrence *</label><input required name="place_of_occurrence" class="form-control"></div><div class="col-md-6"><label class="form-label">Distance / direction from police station</label><input name="distance_direction_from_station" class="form-control" placeholder="e.g. 2 km north-east"></div><div class="col-md-6"><label class="form-label">Delay in reporting, if any</label><input name="delay_reason" class="form-control"></div></div></div></div></div>
  <div class="col-12"><div class="card"><div class="card-body"><h5>3. Offence and complaint</h5><div class="row g-3"><div class="col-md-4"><label class="form-label">Crime category *</label><input required name="crime_type" class="form-control" placeholder="e.g. Theft"></div><div class="col-md-4"><label class="form-label">Applicable IPC / law sections</label><input name="ipc_sections" class="form-control" placeholder="e.g. IPC 379"></div><div class="col-md-4"><label class="form-label">Modus operandi</label><input name="modus_operandi" class="form-control"></div><div class="col-12"><label class="form-label">Complaint / information received *</label><textarea required name="complaint_text" rows="5" class="form-control" placeholder="Record the substance of the complaint or information."></textarea></div><div class="col-md-6"><label class="form-label">Known / suspected accused details</label><textarea name="accused_details" rows="3" class="form-control"></textarea></div><div class="col-md-6"><label class="form-label">Property / articles involved</label><textarea name="property_details" rows="3" class="form-control"></textarea></div><div class="col-md-6"><label class="form-label">Injuries, death, or medical details</label><textarea name="injuries_or_death" rows="3" class="form-control"></textarea></div><div class="col-md-6"><label class="form-label">Action taken / case diary note</label><textarea name="action_taken" rows="3" class="form-control"></textarea></div></div></div></div></div>
  <div class="col-12"><div class="card"><div class="card-body"><h5>4. Recording officer</h5><div class="row g-3"><div class="col-md-6"><label class="form-label">Name *</label><input required name="recording_officer" class="form-control" value="{{ officer_name }}"></div><div class="col-md-6"><label class="form-label">Rank / designation</label><input name="officer_designation" class="form-control" placeholder="e.g. Sub-Inspector"></div></div></div></div></div>
  <div class="col-12"><button class="btn btn-primary px-4" type="submit"><i class="bi bi-file-earmark-plus me-1"></i> Register FIR</button><a class="btn btn-outline-secondary ms-2" href="/crimes">Cancel</a></div>
</form>
{% endblock %}
