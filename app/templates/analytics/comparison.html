{% extends 'base.html' %}
{% block content %}
<div class="card"><div class="card-body">
  <h5>Crime-rate comparison</h5><p class="text-muted">Compare filtered records visually. Crime rate uses the available district population and is shown per 100,000 residents.</p>
  <form id="comparisonFilters" class="row g-3">
    <div class="col-md-3"><label class="form-label">Compare by</label><select class="form-select" name="group_by"><option value="district" {% if filters.get('group_by','district') == 'district' %}selected{% endif %}>District</option><option value="crime_type" {% if filters.get('group_by') == 'crime_type' %}selected{% endif %}>Crime category</option><option value="month" {% if filters.get('group_by') == 'month' %}selected{% endif %}>Month</option></select></div>
    <div class="col-md-3"><label class="form-label">Metric</label><select class="form-select" name="metric"><option value="rate" {% if filters.get('metric','rate') == 'rate' %}selected{% endif %}>Rate per 100,000</option><option value="count" {% if filters.get('metric') == 'count' %}selected{% endif %}>Recorded incident count</option></select></div>
    <div class="col-md-3"><label class="form-label">District filter</label><select class="form-select" name="district"><option value="">All districts</option>{% for item in districts %}<option value="{{item}}" {% if filters.get('district') == item %}selected{% endif %}>{{item}}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">Crime type filter</label><select class="form-select" name="crime_type"><option value="">All categories</option>{% for item in crime_types %}<option value="{{item}}" {% if filters.get('crime_type') == item %}selected{% endif %}>{{item}}</option>{% endfor %}</select></div>
    <div class="col-md-3"><label class="form-label">From date</label><input class="form-control" type="date" name="start_date" value="{{filters.get('start_date','')}}"></div>
    <div class="col-md-3"><label class="form-label">To date</label><input class="form-control" type="date" name="end_date" value="{{filters.get('end_date','')}}"></div>
    <div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100">Update graph</button></div>
  </form>
</div></div>
<div class="card mt-3"><div class="card-body"><img id="comparisonChart" class="img-fluid w-100" alt="Filtered crime comparison chart"></div></div>
{% endblock %}
{% block scripts %}<script>document.getElementById('comparisonChart').src='/comparison/chart.png?'+new URLSearchParams(new FormData(document.getElementById('comparisonFilters'))).toString();</script>{% endblock %}
