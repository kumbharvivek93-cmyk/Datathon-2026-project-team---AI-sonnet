{% extends 'base.html' %}{% block content %}<div class="card"><div class="card-body"><form class="row g-2 mb-3"><div class="col-md-3"><select name="district" class="form-select"><option value="">All districts</option>{% for x in districts %}<option {% if filters.district==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="col-md-3"><select name="crime_type" class="form-select"><option value="">All categories</option>{% for x in crime_types %}<option {% if filters.crime_type==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></div><div class="col"><button class="btn btn-primary">Apply filters</button></div></form><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Case</th><th>Date</th><th>District</th><th>Type</th><th>Status</th></tr></thead><tbody>{% for x in incidents %}<tr><td><a href="/crimes/{{x.id}}">{{x.crime_number}}</a></td><td>{{x.date}}</td><td>{{x.district}}</td><td>{{x.crime_type}}</td><td>{{x.status}}</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
