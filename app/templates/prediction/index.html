{% extends 'base.html' %}{% block content %}<div class="card"><div class="card-body"><h5>Expected case volume</h5><form id="predict" class="row g-2"><div class="col-md-4"><select name="district" class="form-select"><option value="">All districts</option>{% for x in districts %}<option>{{x}}</option>{% endfor %}</select></div><div class="col-md-4"><select name="crime_type" class="form-select"><option value="">All categories</option>{% for x in crime_types %}<option>{{x}}</option>{% endfor %}</select></div><div class="col-md-2"><input type="number" name="month" min="1" max="12" value="7" class="form-control"></div><div class="col"><button class="btn btn-primary">Estimate</button></div></form><div id="result" class="mt-4"></div></div></div>{% endblock %}{% block scripts %}<script>document.querySelector('#predict').onsubmit=e=>{e.preventDefault();fetch('/api/predictions?'+new URLSearchParams(new FormData(e.target))).then(r=>r.json()).then(x=>document.querySelector('#result').innerHTML=`<div class="alert alert-info"><strong>${x.expected_crime_count} expected incidents</strong> · ${x.risk_level} risk<br><small>${x.method}</small></div>`)};</script>{% endblock %}
