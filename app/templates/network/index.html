{% extends 'base.html' %}{% block content %}<div class="card"><div class="card-body"><p class="text-muted">{{graph.summary.nodes}} entities · {{graph.summary.links}} evidentiary links. Select a node to inspect connections.</p><div id="network" style="height:650px"></div></div></div>{% endblock %}{% block scripts %}<script>const graph={{graph|tojson}};cytoscape({container:document.querySelector('#network'),elements:graph.elements,style:[{selector:'node',style:{'label':'data(label)','background-color':'#3b82c4','color':'#fff','font-size':10}},{selector:'node[kind = "crime"]',style:{'background-color':'#9d3158'}},{selector:'edge',style:{'label':'data(label)','line-color':'#697fa4','target-arrow-shape':'triangle','target-arrow-color':'#697fa4','font-size':8,'color':'#d7e0f1'}}],layout:{name:'cose',animate:false}});</script>{% endblock %}
